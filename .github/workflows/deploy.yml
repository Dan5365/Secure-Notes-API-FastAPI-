name: CI/CD Pipeline

on:
  push:
    branches: [ feature/docker-setup ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./auth_service
          push: true
          tags: danmur95/secure-notes-auth:latest

      - name: Build and push notes-service
        uses: docker/build-push-action@v5
        with:
          context: ./notes_service
          push: true
          tags: danmur95/secure-notes-notes:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: danmur95/secure-notes-frontend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Secure-Notes-API-FastAPI-
            git pull origin feature/docker-setup
            docker stack deploy -c docker-stack.yml secure-notes

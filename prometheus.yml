global:
  scrape_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:8000']
  - job_name: 'notes-service'
    static_configs:
      - targets: ['notes-service:8000']
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
